# Codemagic 云端编译（日常构建在这里）：打一个未签名的 ipa，自签后装真机
# 只手动触发（不写 triggering），省免费额度；GitHub Actions（.github/workflows/build.yml）只作备用、也只能手动触发
#
# 可复现：
# - Xcode 固定版本，不跟 latest 漂移（2026-11 时 latest 即 27.1.x）。升级时改这里，构建通过后再提交
# - 依赖锁文件 ci/Package.resolved：存在时只用里面的确切版本（含 KSPlayer 间接引入的 FFmpegKit 等二进制包）；
#   不存在时正常解析，并把这次解析出的 Package.resolved 作为产物导出——下载后放到 ci/ 提交，之后的构建就锁住了
workflows:
  unsigned-ipa:
    name: 未签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 27.1
    cache:
      cache_paths:
        - $CM_BUILD_DIR/build/SourcePackages
    scripts:
      - name: 核对提交并记录构建身份
        script: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [ -n "${NEWBI_EXPECTED_COMMIT:-}" ] && [ "$actual" != "$NEWBI_EXPECTED_COMMIT" ]; then
            echo "远程分支已变化，拒绝构建错误提交"
            exit 1
          fi
          python3 -c 'import json,os,subprocess; json.dump({"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"buildId":os.environ.get("CM_BUILD_ID","")},open("newbi-build-info.json","w"))'
      - name: Xcode 版本
        script: |
          xcodebuild -version
          xcodebuild -version > build-toolchain.log
      - name: 下载 Metal 工具链
        # Xcode 26 起 Metal 工具链不随 Xcode 预装；播放器依赖里有 .metal 着色器，缺了会编译失败
        script: |
          set -euo pipefail
          bash ci/prepare-metal.sh 2>&1 | tee build-metal.log
      - name: 生成工程
        script: |
          brew install xcodegen
          xcodegen generate
      - name: 固定本次依赖版本
        script: |
          set -euo pipefail
          bash ci/resolve-packages.sh 2>&1 | tee build-packages.log
      - name: 打未签名 ipa（真机）
        script: |
          status=0
          bash ci/xcodebuild.sh build \
            -project NewBi.xcodeproj -scheme NewBi -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build-device.log 2>&1 || status=$?
          # 这次实际用到的依赖版本，和 ipa 一起留档
          # Package.resolved 已由依赖解析步骤导出
          # 只把错误打到控制台，完整日志在产物里
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-device.log | sort -u || true
          [ $status -eq 0 ] || exit $status
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NewBi.app Payload/
          zip -qry NewBi-unsigned.ipa Payload
    artifacts:
      - newbi-build-info.json
      - NewBi-unsigned.ipa
      - Package.resolved
      - build-*.log
